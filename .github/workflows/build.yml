name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  host-tests:
    name: Host parser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run pure-logic tests (no hardware)
        run: sh tools/run_tests.sh

  fap-build:
    name: Build FAP (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: official-release
            sdk-channel: release
          - name: official-dev
            sdk-channel: dev
    steps:
      - uses: actions/checkout@v4
      - name: Build with ufbt
        uses: flipperdevices/flipperzero-ufbt-action@v0.1.2
        with:
          sdk-channel: ${{ matrix.sdk-channel }}
      - name: Upload .fap
        uses: actions/upload-artifact@v4
        with:
          name: marauders_mate-${{ matrix.name }}
          path: dist/*.fap
